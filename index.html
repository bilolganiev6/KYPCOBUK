<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
    <style> 
        body {
            background: url(images/t.jpg); 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0; /* Цвет фона страницы */
        }

        .auth-container {
            background-color: white; /* Белый квадрат */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Тень для красоты */
            text-align: center;
        }

        form {
            display: inline-grid;
            gap: 10px; /* Расстояние между элементами формы */
        }

        input[type="text"],
        input[type="password"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"] {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <form action="avto/authorization.php" method="post">
            Авторизация<br>
            Логин: <input name="login" type="text">
            Пароль: <input name="password" type="password">
            <input type="submit" value="Войти">
        </form>
        <p>У меня еще нет <a href="/reg.html">аккаунта</a></p>
    </div>
</body>
</html>
