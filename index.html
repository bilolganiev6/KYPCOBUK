<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Объявление кодировки документа -->
    <meta charset="utf-8">
    
    <!-- Указывает браузеру использовать последнюю версию рендеринга в Internet Explorer -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- Настройка viewport для адаптивности на мобильных устройствах -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Заголовок страницы -->
    <title>Получение товаров</title>
    
    <!-- Подключение Bootstrap CSS для использования готовых стилей -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    
    <!-- Подключение пользовательского CSS файла для дополнительной стилизации -->
    <link href="app/assets/css/style.css" rel="stylesheet" />
    
    <!-- Подключение jQuery (библиотека для работы с DOM и AJAX) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Контейнер, в который будет выводиться содержимое приложения -->
    <div id="app"></div>
    
    <!-- Подключение jQuery (дублируется, но здесь используется более старая версия) -->
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    
    <!-- Подключение JavaScript библиотеки Bootstrap для использования готовых компонентов и плагинов -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
        integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
        crossorigin="anonymous"></script>
    
    <!-- Подключение библиотеки Bootbox для создания всплывающих окон (например, подтверждения действий) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootbox.js/4.4.0/bootbox.min.js"></script>
    
    <!-- Основной файл скриптов приложения -->
    <script src="app/app.js"></script>
    
    <!-- Скрипты для работы с товарами -->
    <script src="app/products/read-products.js"></script> <!-- Скрипт для отображения списка товаров -->
    <script src="app/products/create-product.js"></script> <!-- Скрипт для создания нового товара -->
    <script src="app/products/read-one-product.js"></script> <!-- Скрипт для просмотра одного товара -->
    <script src="app/products/update-product.js"></script> <!-- Скрипт для обновления товара -->
    <script src="app/products/delete-product.js"></script> <!-- Скрипт для удаления товара -->
    <script src="app/products/products.js"></script> <!-- Общие функции для работы с товарами -->
    <script src="app/products/search-products.js"></script> <!-- Скрипт для поиска товаров -->
</body>
</html>
