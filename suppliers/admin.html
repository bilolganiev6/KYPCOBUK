<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Поставщики</title>
</head>
<body>
    <div style="flex: 3;">
        <h1>Поставщики</h1>

        <!-- Поле для поиска -->
        <input type="text" id="search-input" placeholder="Поиск по названию..." oninput="searchPostavshiki()">

        <!-- Кнопка для открытия формы создания поставщика -->
        <button id="add-postavshiki-btn">Добавить поставщика</button>

        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ФИО</th>
                    <th>ИНН</th>
                    <th>Номер телефона</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="postavshiki-table">
            </tbody>
        </table>
        <a href="../admin.html" class="back-button">Назад</a>
    </div>

    <!-- Форма для создания нового поставщика -->
    <div id="add-form" style="display: none;">
        <h2>Добавить поставщика</h2>
        <form id="add-postavshiki-form">
            <label for="add-name">ФИО:</label>
            <input type="text" id="add-name" name="name" required><br>
            <label for="add-inn">ИНН:</label>
            <input type="number" id="add-inn" name="inn" required><br>
            <label for="add-number">Номер телефона:</label>
            <input type="number" id="add-number" name="number" required><br>
            <button type="submit">Сохранить</button>
            <button type="button" onclick="closeAddForm()">Отмена</button>
        </form>
    </div>

    <!-- Форма для редактирования поставщика -->
    <div id="edit-form" style="display: none;">
        <h2>Редактировать поставщика</h2>
        <form id="edit-postavshiki-form">
            <input type="hidden" id="edit-id" name="id">
            <label for="edit-name">ФИО:</label>
            <input type="text" id="edit-name" name="name" required><br>
            <label for="edit-inn">ИНН:</label>
            <input type="number" id="edit-inn" name="inn" required><br>
            <label for="edit-number">Номер телефона:</label>
            <input type="number" id="edit-number" name="number" required><br>
            <button type="submit">Сохранить</button>
            <button type="button" onclick="closeEditForm()">Отмена</button>
        </form>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
