<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад</title>
    <style>
        /* Общие стили */
        body {
            margin: 0;
            padding-top: 80px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Стили для шапки */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgb(255, 255, 255);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        .logo-container {
            display: flex;
            align-items: center;
        }
        .logo {
            height: 55px;
            width: auto;
        }
        .nav-links {
            display: flex;
            gap: 10px;
        }
        .nav-links a {
            text-decoration: none;
            color: white;
            background-color: #ff7220;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .nav-links a:hover {
            background-color: #e05d0a;
        }

        /* Стили для карусели */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 600px;
            overflow: hidden;
        }
        .carousel-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .carousel-slide.active {
            opacity: 1;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slide-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .slide-title {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .slide-text {
            font-size: 1.5em;
            max-width: 800px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        /* Основной контент */
        .content {
            flex: 1;
            padding: 40px 20px;
        }

         /* Стиль для дополнительного изображения под слайдером */
         .image-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 30px 0;
        }
        .centered-image {
            max-width: 80%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        .image-button {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #ff7220;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .image-button:hover {
            background-color: #e55d0c;
        }
        
        /* Стили для подвала */
        footer {
            background-color: #0338bc;
            color: white;
            padding: 20px 10px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
        }
        .social-icons {
            display: flex;
            gap: 15px;
        }
        .social-icons a {
            color: white;
            font-size: 24px;
            text-decoration: none;
            transition: color 0.3s;
        }
        .social-icons a:hover {
            color: #ff7220;
        }
        .phone {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <div class="logo-container">
            <img src="images/logo.png" alt="Логотип компании" class="logo">
        </div>
        <nav class="nav-links">
            <a href="products/user.html">Товары</a>
            <a href="suppliers/user.html">Поставщики</a>
            <a href="/">Выход</a>
        </nav>
    </header>

    <!-- Карусель изображений -->
    <div class="carousel-container">
        <!-- Слайд 1 -->
        <div class="carousel-slide active">
            <img src="images/photo1.jpg" alt="Фото 1">
            <div class="slide-overlay">
                <h2 class="slide-title">О нас</h2>
                <p class="slide-text">+7(960)744-60-99</p>
                <p class="slide-text">bilolganiev6@gmail.ru</p>
            </div>
        </div>
        
        <!-- Слайд 2 -->
        <div class="carousel-slide">
            <img src="images/photo3.jpg" alt="Фото 2">
            <div class="slide-overlay">
                <h2 class="slide-title">Лучшие товары</h2>
            </div>
        </div>
        
        <!-- Слайд 3 -->
        <div class="carousel-slide">
            <img src="images/photo2.jpg" alt="Фото 3">
            <div class="slide-overlay">
                <h2 class="slide-title">От лучших поставщиков</h2>
            </div>
        </div>
    </div>
    <!-- Добавленное изображение с кнопкой -->
    <div class="image-container">
        <img src="images/aksiya.png" alt="Дополнительное изображение" class="centered-image">
        <a href="products/user.html" class="image-button">Заказать</a>
    </div>

    <!-- Подвал -->
    <footer>
        <div class="social-icons">
            <a href="https://t.me/@bilol_ganiev6" target="_blank" title="Telegram">
                <i class="fab fa-telegram"></i>
            </a>
            <a href="https://vk.com/id817145525" target="_blank" title="VK">
                <i class="fab fa-vk"></i>
            </a>
        </div>
        <div class="phone">
            <i class="fas fa-phone"></i>
            <span>+7 (960) 744-60-99</span>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const slides = document.querySelectorAll('.carousel-slide');
            let currentIndex = 0;
            
            function showNextSlide() {
                slides[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % slides.length;
                slides[currentIndex].classList.add('active');
            }
            
            setInterval(showNextSlide, 3000);
        });
    </script>
</body>
</html>
