<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары</title>
    <!-- Подключение внешнего CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div style="display: flex; gap: 20px;">
        <!-- Таблица товаров -->
        <div style="flex: 3;">
            <h1>Товары</h1>
            <!-- Поле для поиска -->
            <input type="text" id="search-input" placeholder="Поиск по названию..." oninput="searchProducts()">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Наименование</th>
                        <th>Количество</th>
                        <th>Цена</th>
                        <th>Ед.измерения</th>
                    </tr>
                </thead>
                <tbody id="products-table">
                </tbody>
            </table>
            <a href="javascript:history.back()" class="back-button">Назад</a>
        </div>
    </div>

    <script src="js/scriptu.js"></script>
</body>
</html>
